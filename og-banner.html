<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>OG Banner - Tono</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }
    
    body {
      width: 1200px;
      height: 630px;
      font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
      background: linear-gradient(135deg, #0a0a0a 0%, #1a1a1a 50%, #0a0a0a 100%);
      color: #f0f0f0;
      overflow: hidden;
      position: relative;
    }
    
    .container {
      width: 100%;
      height: 100%;
      padding: 60px 80px;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      position: relative;
      z-index: 2;
    }
    
    .header {
      display: flex;
      justify-content: space-between;
      align-items: center;
    }
    
    .logo {
      font-size: 48px;
      font-weight: 800;
      color: #d88800;
      letter-spacing: -2px;
    }
    
    .badge {
      background: rgba(216, 136, 0, 0.15);
      border: 1px solid rgba(216, 136, 0, 0.4);
      padding: 10px 24px;
      border-radius: 100px;
      font-size: 16px;
      color: #d88800;
      font-weight: 600;
      letter-spacing: 1px;
    }
    
    .content {
      flex: 1;
      display: flex;
      flex-direction: column;
      justify-content: center;
      gap: 28px;
    }
    
    h1 {
      font-size: 64px;
      font-weight: 800;
      line-height: 1.05;
      letter-spacing: -3px;
      background: linear-gradient(90deg, #ffffff 0%, #e0e0e0 50%, #d88800 100%);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
      max-width: 800px;
    }
    
    .subtitle {
      font-size: 28px;
      color: #a0a0a0;
      font-weight: 400;
      line-height: 1.5;
      max-width: 600px;
    }
    
    .features {
      display: flex;
      gap: 16px;
      flex-wrap: wrap;
      margin-top: 8px;
    }
    
    .feature {
      background: rgba(216, 136, 0, 0.1);
      border: 1px solid rgba(216, 136, 0, 0.25);
      padding: 14px 28px;
      border-radius: 12px;
      font-size: 18px;
      color: #d88800;
      font-weight: 500;
      display: flex;
      align-items: center;
      gap: 10px;
    }
    
    .feature-icon {
      width: 8px;
      height: 8px;
      background: #d88800;
      border-radius: 50%;
    }
    
    .footer {
      display: flex;
      justify-content: space-between;
      align-items: center;
      border-top: 1px solid rgba(255,255,255,0.1);
      padding-top: 24px;
    }
    
    .price {
      display: flex;
      align-items: baseline;
      gap: 12px;
    }
    
    .price-value {
      font-size: 42px;
      font-weight: 800;
      color: #d88800;
      letter-spacing: -1px;
    }
    
    .price-period {
      font-size: 20px;
      color: #808080;
      font-weight: 400;
    }
    
    .url {
      font-size: 24px;
      color: #606060;
      font-weight: 600;
      letter-spacing: 0.5px;
    }
    
    .gradient-circle {
      position: absolute;
      width: 700px;
      height: 700px;
      border-radius: 50%;
      background: radial-gradient(circle, rgba(216, 136, 0, 0.12) 0%, transparent 70%);
      top: -250px;
      right: -150px;
      z-index: 1;
    }
    
    .gradient-circle-2 {
      position: absolute;
      width: 500px;
      height: 500px;
      border-radius: 50%;
      background: radial-gradient(circle, rgba(216, 136, 0, 0.08) 0%, transparent 70%);
      bottom: -150px;
      left: -150px;
      z-index: 1;
    }
    
    .grid-pattern {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background-image: 
        linear-gradient(rgba(255,255,255,0.03) 1px, transparent 1px),
        linear-gradient(90deg, rgba(255,255,255,0.03) 1px, transparent 1px);
      background-size: 50px 50px;
      z-index: 1;
    }
    
    .accent-line {
      position: absolute;
      bottom: 0;
      left: 0;
      width: 100%;
      height: 4px;
      background: linear-gradient(90deg, #d88800, #b06e00, #d88800);
      z-index: 3;
    }
  </style>
</head>
<body>
  <div class="grid-pattern"></div>
  <div class="gradient-circle"></div>
  <div class="gradient-circle-2"></div>
  <div class="accent-line"></div>
  
  <div class="container">
    <div class="header">
      <div class="logo">TONO</div>
      <div class="badge">PLATAFORMA ONLINE</div>
    </div>
    
    <div class="content">
      <h1>Escala de Cinzas & Valores Tonais</h1>
      <p class="subtitle">15 ferramentas interativas para artistas<br>dominarem a pintura tonal</p>
      
      <div class="features">
        <div class="feature">
          <div class="feature-icon"></div>
          Escala de Cinzas
        </div>
        <div class="feature">
          <div class="feature-icon"></div>
          Treino de Valores
        </div>
        <div class="feature">
          <div class="feature-icon"></div>
          Posterizar
        </div>
        <div class="feature">
          <div class="feature-icon"></div>
          + 12 ferramentas
        </div>
      </div>
    </div>
    
    <div class="footer">
      <div class="price">
        <span class="price-value">R$ 97</span>
        <span class="price-period">acesso imediato</span>
      </div>
      <div class="url">tono.art.br</div>
    </div>
  </div>
</body>
</html>
