<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Logo SB Animada - Preview</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            background: #1a1a1a;
            font-family: 'Inter', sans-serif;
            color: white;
        }
        h1 { margin-bottom: 2rem; font-size: 1.5rem; }
        .logo-container {
            width: 300px;
            height: 300px;
        }
        .logo-container svg {
            width: 100%;
            height: 100%;
        }
        p { margin-top: 2rem; opacity: 0.6; font-size: 0.9rem; }
    </style>
</head>
<body>
    <h1>Logo SB Animada</h1>
    <div class="logo-container">
        <img src="logo-sb-animated.svg" alt="Logo SB Animada">
    </div>
    <p>Circulo externo: sentido horario | Circulo interno: sentido anti-horario</p>
</body>
</html>
