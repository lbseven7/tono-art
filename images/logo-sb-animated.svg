<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="200" height="200">
  <defs>
    <!-- Gradiente vertical 11 tons -->
    <linearGradient id="grad-v" x1="0%" y1="0%" x2="0%" y2="100%"
                    gradientTransform="rotate(0, 100, 100)">
      <stop offset="0%"    stop-color="#FFFFFF" />
      <stop offset="10%"   stop-color="#E6E6E6" />
      <stop offset="20%"   stop-color="#CCCCCC" />
      <stop offset="30%"   stop-color="#B3B3B3" />
      <stop offset="40%"   stop-color="#999999" />
      <stop offset="50%"   stop-color="#808080" />
      <stop offset="60%"   stop-color="#666666" />
      <stop offset="70%"   stop-color="#4D4D4D" />
      <stop offset="80%"   stop-color="#333333" />
      <stop offset="90%"   stop-color="#191919" />
      <stop offset="100%"  stop-color="#000000" />
    </linearGradient>
    
    <!-- Estilo de animacao -->
    <style>
      @keyframes girar-divisao {
        from { transform: rotate(0deg); }
        to { transform: rotate(360deg); }
      }
      .divisao {
        animation: girar-divisao 8s linear infinite;
        transform-origin: 100px 100px;
      }
    </style>
  </defs>
  
  <!-- Fundo escuro -->
  <rect width="200" height="200" fill="#1a1a1a"/>
  
  <!-- Aneis com gradiente que gira -->
  <g class="divisao">
    <!-- Externo: circulo raio 95 com furo raio 70 -->
    <circle cx="100" cy="100" r="95" fill="url(#grad-v)"/>
    <circle cx="100" cy="100" r="70" fill="#1a1a1a"/>
    
    <!-- Interno: circulo raio 55 com furo raio 30 -->
    <circle cx="100" cy="100" r="55" fill="url(#grad-v)"/>
    <circle cx="100" cy="100" r="30" fill="#1a1a1a"/>
  </g>
</svg>
