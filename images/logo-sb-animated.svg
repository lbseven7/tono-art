<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="200" height="200">
  <defs>
    <!-- Divisao vertical branco/preto com linha marcada -->
    <linearGradient id="grad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%"    stop-color="#FFFFFF" />
      <stop offset="49.5%" stop-color="#FFFFFF" />
      <stop offset="50%"   stop-color="#000000" />
      <stop offset="100%"  stop-color="#000000" />
    </linearGradient>
    
    <!-- Estilo de animacao -->
    <style>
      @keyframes girar-horario {
        from { transform: rotate(0deg); }
        to { transform: rotate(360deg); }
      }
      @keyframes girar-antihorario {
        from { transform: rotate(0deg); }
        to { transform: rotate(-360deg); }
      }
      .externo {
        animation: girar-horario 8s linear infinite;
        transform-origin: 100px 100px;
      }
      .interno {
        animation: girar-antihorario 6s linear infinite;
        transform-origin: 100px 100px;
      }
    </style>
  </defs>
  
  <!-- Aneis (circulos com furo no centro) -->
  <!-- Externo: circulo raio 95 com furo raio 70 -->
  <g class="externo">
    <circle cx="100" cy="100" r="95" fill="url(#grad)"/>
    <circle cx="100" cy="100" r="70" fill="#1a1a1a"/>
  </g>
  
  <!-- Interno: circulo raio 55 com furo raio 30 -->
  <g class="interno">
    <circle cx="100" cy="100" r="55" fill="url(#grad)"/>
    <circle cx="100" cy="100" r="30" fill="#1a1a1a"/>
  </g>
</svg>
